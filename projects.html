<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أعمالي | هشام حسن</title>

      <!-- الأيقونة اللي بتظهر في التاب -->
  <link rel="icon" type="image/png" href="images/favicon.svg">

  <!-- أيقونة الآيفون (لو حد ضاف الموقع للشاشة الرئيسية) -->
  <link rel="apple-touch-icon" href="images/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- شريط تقدم القراءة -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- شريط التنقل -->
    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo-white.png.png" alt="Logo" class="logo-light">
            <img src="images/logo-black.png.png" alt="Logo" class="logo-dark">
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="index.html#about">عني</a></li>
            <li><a href="index.html#skills">المهارات</a></li>
            <li><a href="projects.html" class="active">أعمالي</a></li>
            <li><a href="index.html#contact">تواصل</a></li>
        </ul>
        <div class="nav-actions">
            <button class="icon-btn" id="themeBtn" title="تبديل المظهر">🌙</button>
            <button class="icon-btn burger" id="burger">☰</button>
        </div>
    </nav>

    <!-- قسم الأعمال -->
    <section id="projects" style="padding-top: 150px; min-height: 100vh;">
        <div class="sec-head reveal">
            <div class="sec-tag">— معرض أعمالي —</div>
            <h2 class="sec-title">كل <span>المشاريع</span></h2>
            <p style="color: var(--muted); margin-top: 15px; max-width: 600px; margin-inline: auto;">
                هنا تجد مجموعة من أفضل المشاريع التي عملت عليها، بدءاً من تطبيقات الويب وصولاً إلى المنصات المتكاملة.
            </p>
        </div>

        <!-- أزرار الفلترة -->
        <div class="filter-btns reveal">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="frontend"> Frontend</button>
            <button class="filter-btn" data-filter="fullstack">Fullstack</button>
        </div>

        <!-- شبكة المشاريع -->
        <div class="projects-grid" id="projectsGrid">
            <!-- رسالة مؤقتة بتظهر لحد ما المشاريع تتحمل -->
            <div id="loadingMsg" style="text-align: center; width: 100%; grid-column: 1 / -1; padding: 50px; color: var(--muted);">
                ⏳ جاري تحميل المشاريع...
            </div>
        </div>
    </section>

    <footer>heshamcrazy — جميع الحقوق محفوظة © 2026</footer>

    <!-- زر العودة للأعلى -->
    <button class="back-to-top" id="backToTop" aria-label="أعلى الصفحة">↑</button>

    <script src="script.js"></script>

    <!-- كود جلب المشاريع من ملف projects.json -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var grid = document.getElementById('projectsGrid');

            // ضفنا ?t=... عشان نمنع المتصفح من عمل كاش (Cache) للملف القديم
            fetch('projects.json?t=' + new Date().getTime())
                .then(function(response) {
                    if (!response.ok) throw new Error('لم يتم العثور على ملف projects.json');
                    return response.json();
                })
                .then(function(data) {
                    grid.innerHTML = ''; // مسح رسالة التحميل

                    if (!data || data.length === 0) {
                        grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1 / -1; padding: 50px; color: var(--muted);">لا توجد مشاريع حالياً. قم بإضافتها من لوحة التحكم.</div>';
                        return;
                    }

                    // رسم كل مشروع
                    data.forEach(function(p) {
                        var tagsHTML = '';
                        if (p.tags && Array.isArray(p.tags)) {
                            tagsHTML = p.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
                        }

                        var imgHTML = p.image ? '<img src="' + p.image + '" alt="' + p.name + '" style="width: 100%; height: 100%; object-fit: cover;">' : '';
                        var linkHTML = p.link ? '<a href="' + p.link + '" class="project-link" target="_blank">عرض المشروع ←</a>' : '';
                        var styleClass = (p.style && p.style !== '0') ? ' project-img-' + p.style : '';

                        // ضفنا كلاس show وستايل مباشر عشان نضمن إن الكارت يظهر وميتخباش بسبب الأنيميشن
                        var cardHTML = 
                            '<div class="project show" data-category="' + p.category + '" style="opacity: 1; transform: translateY(0);">' +
                                '<div class="project-img' + styleClass + '">' +
                                    imgHTML +
                                '</div>' +
                                '<div class="project-body">' +
                                    '<h3>' + p.name + '</h3>' +
                                    '<p>' + p.desc + '</p>' +
                                    '<div class="tags">' + tagsHTML + '</div>' +
                                    linkHTML +
                                '</div>' +
                            '</div>';

                        grid.insertAdjacentHTML('beforeend', cardHTML);
                    });
                })
                .catch(function(error) {
                    console.error(error);
                    grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1 / -1; padding: 50px; color: #ef4444;">' +
                        'عذراً، حدث خطأ في تحميل المشاريع.<br>' +
                        '<small>تأكد من وجود ملف projects.json في نفس المجلد.</small>' +
                        '</div>';
                });
        });
    </script>
</body>

</html>
